name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-1-100-shared-sccache:
    name: Rust 1.100.0 shared sccache
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@097cc824fc551bce6708700117f796c746689faa # main
    with:
      rust-toolchain: "1.100.0"
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: >-
        cargo +1.100.0 fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo +1.100.0 clippy --workspace --all-targets --all-features -- -D warnings -A unfulfilled-lint-expectations &&
        cargo +1.100.0 test --workspace --all-features
