name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-shared-sccache:
    name: Native nightly shared sccache
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
    with:
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: >-
        cargo test --workspace --all-features
