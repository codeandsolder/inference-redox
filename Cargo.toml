[package]
name = "inference-redox"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Provider-agnostic inference routing with shape-aware cost/latency selection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/inference-redox"

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
